services:
  - type: web
    name: orion-music
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: YOUTUBE_API_URL
        value: https://www.googleapis.com/youtube/v3
      - key: YOUTUBE_API_KEY
        sync: false
